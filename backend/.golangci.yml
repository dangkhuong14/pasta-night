# golangci-lint v2. Linter set: docs/PROJECT-RULES.md §2.
version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      # Tests read fixtures and temp files by variable path and use fixed fake tokens.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - pasta_night/be
